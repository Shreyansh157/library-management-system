<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Members - Library Management System</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <nav class="navbar dashboard-navbar">
      <div class="container">
        <a href="/dashboard.html" class="navbar-brand">
          <i class="bi bi-book-half"></i>
          <span>Library Management System</span>
        </a>

        <a href="/dashboard.html" class="btn logout-btn">
          <i class="bi bi-grid-1x2"></i>
          Dashboard
        </a>
      </div>
    </nav>

    <main class="container py-5">
      <div class="page-header">
        <div>
          <h2>
            <i class="bi bi-people"></i>
            Member Management
          </h2>

          <p>Manage registered library members.</p>
        </div>

        <button type="button" class="btn add-btn" data-bs-toggle="modal" data-bs-target="#memberModal" onclick="openAddMemberModal()">
          <i class="bi bi-person-plus"></i>
          Add Member
        </button>
      </div>

      <div class="search-container">
        <i class="bi bi-search"></i>

        <input type="text" id="searchInput" class="form-control" placeholder="Search by ID, name or address..." />
      </div>

      <div class="data-card">
        <div class="table-responsive">
          <table class="table books-table mb-0">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Address</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>

            <tbody id="membersTableBody"></tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Add/Edit Member Modal -->

    <div class="modal fade" id="memberModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content book-modal">
          <div class="modal-header">
            <div>
              <h5 class="modal-title" id="modalTitle">Add Member</h5>

              <p class="modal-subtitle">Add a new member to the library.</p>
            </div>

            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>

          <form id="memberForm">
            <div class="modal-body">
              <input type="hidden" id="memberId" />

              <div class="mb-3">
                <label for="name" class="form-label"> Full Name </label>

                <input type="text" class="form-control" id="name" placeholder="Enter member name" required />
              </div>

              <div class="mb-3">
                <label for="phone" class="form-label"> Phone Number </label>

                <input type="text" class="form-control" id="phone" placeholder="Enter phone number" required />
              </div>

              <div class="mb-3">
                <label for="address" class="form-label"> Address </label>

                <textarea class="form-control" id="address" rows="3" placeholder="Enter member address"></textarea>
              </div>
            </div>

            <div class="modal-footer">
              <button type="button" class="btn modal-cancel-btn" data-bs-dismiss="modal">Cancel</button>

              <button type="submit" class="btn modal-save-btn">
                <i class="bi bi-check-lg"></i>
                Save Member
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="modal fade" id="messageModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content message-modal">
          <div class="modal-body text-center">
            <div id="messageModalIcon" class="message-modal-icon">
              <i class="bi bi-check-lg"></i>
            </div>

            <h5 id="messageModalTitle" class="message-modal-title">Success</h5>

            <p id="messageModalText" class="message-modal-text">Member added successfully.</p>

            <button type="button" class="btn message-modal-btn" data-bs-dismiss="modal">OK</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content message-modal">
          <div class="modal-body text-center">
            <div class="message-modal-icon delete-confirm-icon">
              <i class="bi bi-trash3"></i>
            </div>

            <h5 class="message-modal-title">Confirm Delete</h5>

            <p id="confirmModalText" class="message-modal-text">Are you sure you want to delete this member?</p>

            <div class="d-flex justify-content-center gap-2">
              <button type="button" class="btn modal-cancel-btn" data-bs-dismiss="modal">Cancel</button>

              <button type="button" id="confirmDeleteBtn" class="btn delete-confirm-btn">Delete</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script src="js/auth.js"></script>
    <script src="js/members.js"></script>
  </body>
</html>
